name: Fuzz CI & Coverage Pages CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fuzz_smoke:
    name: CI - Build, Smoke Fuzz & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Docker image
        run: docker build -t cjson-libfuzzer-testing .

      - name: Build Fuzz Targets
        run: |
          docker run --rm -v "${PWD}:/work" -w /work cjson-libfuzzer-testing bash -lc "
          cmake -S . -B build -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug &&
          cmake --build build --parallel"

      - name: Run Core Smoke Tests (10s each)
        run: |
          mkdir -p artifacts
          docker run --rm -v "${PWD}:/work" -w /work cjson-libfuzzer-testing bash -lc "
          set -e
          ./build/fuzz_parse -max_total_time=10 -artifact_prefix=artifacts/ corpus/parse
          ./build/fuzz_print -max_total_time=10 -artifact_prefix=artifacts/ corpus/print
          ./build/fuzz_minify -max_total_time=10 -artifact_prefix=artifacts/ corpus/minify
          ./build/fuzz_boundary -max_total_time=10 -artifact_prefix=artifacts/ corpus/boundary
          ./build/fuzz_reference -max_total_time=10 -artifact_prefix=artifacts/ corpus/reference
          ./build/fuzz_memory_structure -max_total_time=10 -artifact_prefix=artifacts/ corpus/memory_structure
          # fuzz_hooks uses ASAN_OPTIONS=detect_leaks=0 in CI due to known upstream cJSON v1.7.19 OOM leak at cJSON.c:2147 (ASan remains active)
          ASAN_OPTIONS=detect_leaks=0 ./build/fuzz_hooks -max_total_time=10 -detect_leaks=0 -artifact_prefix=artifacts/ corpus/hooks
          ./build/fuzz_create_and_types -max_total_time=10 -artifact_prefix=artifacts/ corpus/create_and_types
          ./build/fuzz_mutate -max_total_time=10 -artifact_prefix=artifacts/ corpus/mutate
          ./build/fuzz_compare -max_total_time=10 -artifact_prefix=artifacts/ corpus/compare"

      - name: Generate LLVM Coverage Report (HTML)
        run: |
          docker run --rm -v "${PWD}:/work" -w /work cjson-libfuzzer-testing bash -lc "
          bash scripts/run_coverage.sh | tee artifacts/cov/summary.txt
          chmod -R a+rX artifacts/cov/html || true"
          {
            echo "## LLVM Coverage Summary (\`cJSON.c\`)"
            echo '```text'
            tail -n 10 artifacts/cov/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload Coverage HTML Artifact for Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/cov/html

      - name: Upload Crash Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-artifacts
          path: |
            artifacts/*
            !artifacts/.gitkeep
          if-no-files-found: ignore

  deploy_coverage_pages:
    name: CD - Deploy Coverage Report to GitHub Pages
    needs: fuzz_smoke
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Coverage Report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
